---
apiVersion: batch/v1
kind: Job
metadata:
  name: os-job
spec:
  template:
    spec:
      containers:
        - name: os-container
          image: quay.io/centos/centos:10
          command: ["/bin/bash"]
          args:
            - "-c"
            - "echo 'Hello, OS'; sleep 60; echo 'Bye, OS'"
      restartPolicy: Never