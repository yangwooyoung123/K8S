---
apiVersion: v1
kind: Pod
metadata:
  name: empty-pod
spec:
  containers:
  - name: web-server
    image: nginx:1.26
    ports:
    - containerPort: 80

    # 2. 볼륨 마운트
    volumeMounts:
      - name: html
        mountPath: /usr/share/nginx/html

  # 1. 볼륨 정의
  volumes:
    - name: html
      emptyDir: {}