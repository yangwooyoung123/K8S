---
apiVersion: v1
kind: Pod
metadata:
  name: web
spec:
  containers:
    - name: nginx
      image: nginx:1.26
      ports:
        - containerPort: 80
          protocol: TCP
      # 2. 볼륨 마운트:
      volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
  # Local(/webdata) - mount -> Container(/usr/share/nginx/html)
  # 1. 볼륨 정의:
  volumes:
    - name: html
      hostPath:
        path: /webdata
  
