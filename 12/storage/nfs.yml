---
apiVersion: v1
kind: Pod
metadata:
  name: web-nfs
spec:
  containers:
  - image: nginx
    name: nginx
    ports:
      - containerPort: 80
        protocol: TCP

    # 2. 볼륨 마운트
    volumeMounts:
      - name: html
        mountPath: /usr/share/nginx/html
  # 1. 볼륨 정의
  volumes:
    - name: html
      nfs:
        server: 192.168.10.14
        path: /nas/k8s